<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Kinescope · Evening comps</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Mona+Sans:wdth,wght@100..112,400..800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="evening.css">
<style>
.head { position: absolute; left: 96px; top: 72px; }
.head p { margin-top: 10px; font: 500 23px/1.3 var(--sans); color: var(--mute); }
.list { position: absolute; left: 96px; right: 96px; top: 216px; display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px 18px; }
.list .setting { margin: 0; height: 80px; font-size: 24px; }
</style>
</head>
<body>
<div class="head">
  <div class="t-page">Evening comps</div>
  <p>Arrows to move, OK to open, Back to return here.</p>
</div>
<div class="list" id="list"></div>
<script>
const comps = [
  ['Home', 'e-evening.html'], ['Home · movie row', 'e-evening.html?row=3&col=2'], ['Home · nav', 'e-evening.html?state=nav'], ['Home · actions', 'e-evening.html?state=menu'],
  ['Home · loading', 'e-evening.html?state=loading'], ['Library', 'library.html'], ['Library · genre', 'library.html?state=genre'], ['Library · empty', 'library.html?state=empty'],
  ['Library · loading', 'library.html?state=loading'], ['Movie', 'detail.html'], ['Show', 'detail.html?kind=show'], ['Show · episodes', 'detail.html?kind=show&focus=episodes'],
  ['Who’s watching', 'profiles.html'], ['PIN', 'profiles.html?state=pin'], ['PIN · wrong', 'profiles.html?state=wrong'], ['Player', 'player.html'],
  ['Player · skip intro', 'player.html?state=intro'], ['Player · up next', 'player.html?state=next'], ['Player · tracks', 'player.html?state=tracks'], ['Search', 'search.html'],
  ['Search · recent', 'search.html?state=empty'], ['Search · none', 'search.html?state=none'], ['Settings', 'settings.html'], ['About', 'settings.html?state=about'],
  ['Sign in', 'login.html'], ['Sign in · error', 'login.html?state=error'], ['Splash', 'splash.html'], ['App icon', 'icon.html'],
];
const list = document.getElementById('list');
const els = comps.map(([t, u]) => { const d = document.createElement('div'); d.className = 'setting'; d.textContent = t; list.appendChild(d); return d; });
let i = Number(sessionStorage.getItem('comp') || 0);
const COLS = 4;
const draw = () => els.forEach((e, k) => e.classList.toggle('focus', k === i));
draw();
addEventListener('keydown', e => {
  const k = e.key;
  if (k === 'ArrowRight') i = Math.min(els.length - 1, i + 1);
  else if (k === 'ArrowLeft') i = Math.max(0, i - 1);
  else if (k === 'ArrowDown') i = Math.min(els.length - 1, i + COLS);
  else if (k === 'ArrowUp') i = Math.max(0, i - COLS);
  else if (k === 'Enter') { sessionStorage.setItem('comp', i); location.href = comps[i][1]; return; }
  else return;
  e.preventDefault();
  draw();
});
</script>
</body>
</html>
