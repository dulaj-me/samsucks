<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Kinescope · D · Familiar</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root {
  --ground: #0E1014;
  --text: #F4F5F7;
  --mute: #A3A8B3;
  --chip: rgba(255, 255, 255, 0.14);
  --accent: #5AA9FF;
  --sans: 'Figtree', sans-serif;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { width: 1920px; height: 1080px; overflow: hidden; background: var(--ground); color: var(--text); font-family: var(--sans); -webkit-font-smoothing: antialiased; }
/* Stands in for the app's 2x2 WebGL ambience canvas fed by UltraBlur colors. */
.amb { position: absolute; inset: 0; opacity: 0.55; }

.art { position: absolute; left: 576px; top: 120px; width: 1344px; height: 640px; object-fit: cover;
  -webkit-mask-image: linear-gradient(to right, transparent 0, #000 40%), linear-gradient(to top, transparent 0, #000 42%);
  -webkit-mask-composite: source-in; }

.top { position: absolute; left: 96px; right: 96px; top: 44px; height: 60px; display: flex; align-items: center; }
.brand { font: 800 36px/1 var(--sans); letter-spacing: -0.02em; margin-right: 56px; }
.brand span { color: var(--accent); }
.nav { display: flex; gap: 6px; }
.ni { height: 52px; padding: 0 24px; border-radius: 26px; display: flex; align-items: center; font: 600 26px/1 var(--sans); color: var(--mute); }
.ni.on { color: var(--text); }
.ni svg { width: 28px; height: 28px; }
.who { margin-left: auto; width: 52px; height: 52px; border-radius: 12px; background: #6B5BD6; display: flex; align-items: center; justify-content: center; font: 700 24px/1 var(--sans); }

.info { position: absolute; left: 96px; top: 176px; width: 860px; }
.logo { display: block; max-width: 540px; max-height: 160px; object-fit: contain; object-position: left bottom; }
.title { font: 800 88px/1 var(--sans); letter-spacing: -0.025em; }
.meta { margin-top: 24px; display: flex; align-items: center; gap: 14px; font: 500 25px/1 var(--sans); color: var(--mute); }
.chip { padding: 6px 10px; border-radius: 6px; background: var(--chip); font: 700 18px/1 var(--sans); color: var(--text); letter-spacing: 0.04em; }
.sum { margin-top: 20px; font: 400 25px/1.45 var(--sans); color: #D2D5DC; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }

.row { position: absolute; left: 0; width: 1920px; }
.row.off { opacity: 0.5; }
.rh { margin-left: 96px; font: 700 30px/40px var(--sans); }
.tile { position: absolute; top: 56px; }
.f { position: relative; width: 384px; height: 216px; overflow: hidden; border-radius: 14px; background: #1C1F26; }
.poster .f { width: 216px; height: 324px; }
.f img { width: 100%; height: 100%; object-fit: cover; display: block; }
.bar { position: absolute; left: 14px; right: 14px; bottom: 14px; height: 6px; border-radius: 3px; background: rgba(0,0,0,0.55); overflow: hidden; }
.bar i { display: block; height: 100%; background: var(--accent); }
.ring { position: absolute; left: 88px; top: 48px; width: 400px; height: 232px; border: 4px solid var(--text); border-radius: 20px; }
</style>
</head>
<body>
<div class="amb" id="amb"></div>
<img class="art" id="art" alt="">
<div class="top">
  <div class="brand">kinescope<span>.</span></div>
  <div class="nav" id="nav"></div>
  <div class="who">D</div>
</div>
<div class="info">
  <img class="logo" id="logo" alt="">
  <div class="title" id="title"></div>
  <div class="meta" id="meta"></div>
  <p class="sum" id="sum"></p>
</div>
<div id="rows"></div>
<script type="module">
import * as D from './data.js';
const $ = id => document.getElementById(id);
const { sections, rows } = await D.load();
const state = { rows, row: 0, col: 0 };
const SEARCH = '<svg viewBox="0 0 24 24"><circle fill="none" stroke="currentColor" stroke-width="2.4" cx="10.5" cy="10.5" r="6.5"/><path stroke="currentColor" stroke-width="2.4" stroke-linecap="round" d="M15.5 15.5L20 20"/></svg>';
const GEAR = '<svg viewBox="0 0 24 24"><circle fill="none" stroke="currentColor" stroke-width="2.2" cx="12" cy="12" r="3.2"/><path fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" d="M12 2.8l1.6 2.4 2.8-.7.7 2.8 2.4 1.6-1.2 2.6 1.2 2.6-2.4 1.6-.7 2.8-2.8-.7L12 21.2l-1.6-2.4-2.8.7-.7-2.8-2.4-1.6L5.7 12 4.5 9.4l2.4-1.6.7-2.8 2.8.7z"/></svg>';
D.h('div', 'ni on', $('nav'), 'Home');
sections.forEach(s => D.h('div', 'ni', $('nav'), s.title));
D.h('div', 'ni', $('nav')).innerHTML = SEARCH;
D.h('div', 'ni', $('nav')).innerHTML = GEAR;

async function hero(it) {
  $('art').src = D.img(D.heroArt(it), 1344, 756);
  const u = it.UltraBlurColors;
  if (u) $('amb').style.background = `radial-gradient(at 0 0, #${u.topLeft}, transparent 60%), radial-gradient(at 0 100%, #${u.bottomLeft}, transparent 60%), radial-gradient(at 100% 100%, #${u.bottomRight}, transparent 60%)`;
  const logo = D.clearLogo(it);
  $('logo').style.display = logo ? '' : 'none';
  $('title').style.display = logo ? 'none' : '';
  if (logo) $('logo').src = D.img(logo, 540, 160, 'png');
  $('title').textContent = D.showTitle(it);
  $('sum').textContent = it.summary || '';
  const m = $('meta');
  m.innerHTML = '';
  const bits = it.type === 'episode' ? [D.epCode(it), it.title, D.left(it)] : [D.year(it), it.contentRating, D.runtime(it.duration)];
  D.h('span', '', m, bits.filter(Boolean).join('  ·  '));
  const f = D.formats(it, await D.detail(it)) || {};
  [[f.res, f.res], ['DOLBY VISION', f.dv], ['HDR', f.hdr && !f.dv], ['ATMOS', f.atmos]].forEach(([t, on]) => on && D.h('span', 'chip', m, t));
}

function render() {
  const box = $('rows');
  box.innerHTML = '';
  let y = 652;
  state.rows.slice(state.row, state.row + 2).forEach((r, ri) => {
    const wide = /continue|ondeck/i.test(r.hubIdentifier);
    const row = D.h('section', 'row' + (ri ? ' off' : ''), box);
    row.style.top = y + 'px';
    D.h('div', 'rh', row, r.title);
    const w = wide ? 384 : 216, step = w + 28;
    const start = ri === 0 ? state.col : 0;
    r.Metadata.slice(start, start + 9).forEach((it, i) => {
      const t = D.h('div', 'tile' + (wide ? '' : ' poster'), row);
      t.style.left = (96 + i * step) + 'px';
      const f = D.h('div', 'f', t);
      D.h('img', '', f).src = D.img(wide ? D.wideArt(it) : D.posterArt(it), w, wide ? 216 : 324);
      const p = D.progress(it);
      if (p) { const b = D.h('div', 'bar', f); D.h('i', '', b).style.width = (p * 100).toFixed(1) + '%'; }
    });
    if (ri === 0) {
      const g = D.h('div', 'ring', row);
      if (!wide) { g.style.width = '232px'; g.style.height = '340px'; }
    }
    y += wide ? 320 : 428;
  });
  hero(state.rows[state.row].Metadata[state.col]);
}
render();
D.dpad(state, render);
</script>
</body>
</html>
