<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Kinescope · Search</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Mona+Sans:wdth,wght@100..112,400..800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="evening.css">
<style>
/* Keyboard column on the left, live results to its right bleeding off the edge like Home rows. */
.field { position: absolute; left: 96px; top: 84px; width: 530px; height: 80px; display: flex; align-items: center; gap: 18px; border-bottom: 2px solid var(--hair); }
.field > svg { width: 34px; height: 34px; color: var(--mute); flex-shrink: 0; }
.q { flex: 1; min-width: 0; display: flex; align-items: center; font: 650 52px/1.3 var(--sans); letter-spacing: -0.015em; white-space: nowrap; overflow: hidden; }
.q span { color: var(--mute); font: 520 34px/1 var(--sans); letter-spacing: 0; }
.caret { flex-shrink: 0; width: 3px; height: 50px; margin: 0 6px 0 7px; border-radius: 2px; background: var(--text); }

.keys { position: absolute; left: 96px; top: 204px; display: grid; grid-template-columns: repeat(6, 80px); grid-auto-rows: 80px; gap: 10px; }
.key { display: flex; align-items: center; justify-content: center; border-radius: 14px; background: var(--ghost); font: 600 34px/1 var(--sans); color: var(--soft); }
.key.wide { grid-column: span 2; font-size: 26px; }
.key svg { width: 34px; height: 34px; }
.key.focus { background: var(--text); color: var(--on-text); }

.results { position: absolute; left: 706px; top: 84px; right: 0; bottom: 0; }
.rrow { position: absolute; left: 0; width: 1214px; }
.rrow .tile { top: 56px; }
.chips { margin-top: 24px; width: 1100px; display: flex; flex-wrap: wrap; gap: 14px; }
.results .msg { margin-top: 4px; }
</style>
</head>
<body>
<canvas id="amb" width="2" height="2"></canvas>
<div class="field" id="field"></div>
<div class="keys" id="keys"></div>
<div class="results" id="results"></div>
<script type="module">
import * as D from './data.js';
import { icon, ambience } from './chrome.js';
const $ = id => document.getElementById(id);
const qs = new URLSearchParams(location.search);
const state = qs.get('state');
const query = qs.has('q') ? qs.get('q') : state === 'empty' ? '' : state === 'none' ? 'paddington' : 'the';
const focus = qs.get('key') || (state === 'empty' ? 'a' : state === 'none' ? 'del' : 'e');

// Same endpoint and hub filter as session.server.search() in app/js/plex/server.js.
const HUBS = { movie: 1, show: 1, episode: 1, season: 1, mixed: 1, clip: 1 };
async function search(q) {
  const r = await fetch('/pms/hubs/search?' + new URLSearchParams({ query: q, limit: 30, includeCollections: 0 }), { headers: { Accept: 'application/json' } });
  const mc = (await r.json()).MediaContainer;
  return (mc.Hub || []).filter(h => h.size > 0 && HUBS[h.type] && h.Metadata);
}

const field = $('field');
field.innerHTML = icon.search;
const q = D.h('div', 'q', field, query);
D.h('i', 'caret', q);
if (!query) D.h('span', '', q, 'Search movies and shows');

const keys = 'abcdefghijklmnopqrstuvwxyz1234567890'.split('').map(k => ({ id: k, label: k }))
  .concat([{ id: 'space', svg: icon.space }, { id: 'del', svg: icon.del }, { id: 'clear', label: 'Clear' }]);
keys.forEach(k => {
  const el = D.h('div', 'key' + (k.label && k.label.length === 1 ? '' : ' wide') + (k.id === focus ? ' focus' : ''), $('keys'), k.label);
  if (k.svg) el.innerHTML = k.svg;
});

// Pushed screens restore the ambience Home last set: the launch-focused Continue Watching title.
const { rows } = await D.load();
ambience($('amb'), rows[0] && rows[0].Metadata[0].UltraBlurColors);

function caption(it) {
  if (it.type === 'episode') return [it.title, it.grandparentTitle + '  ·  ' + D.epCode(it)];
  if (it.type === 'show') return [it.title, [it.year, it.childCount && it.childCount + (it.childCount > 1 ? ' seasons' : ' season')].filter(Boolean).join('  ·  ')];
  return [it.title, [D.year(it), D.runtime(it.duration)].filter(Boolean).join('  ·  ')];
}

const box = $('results');
if (!query) {
  D.h('div', 't-row', box, 'Recent searches');
  const chips = D.h('div', 'chips', box);
  // Stored as typed: short and lowercase, so derive them from library titles the same way.
  const seen = new Set();
  rows.flatMap(r => r.Metadata).map(D.showTitle)
    .map(t => t.toLowerCase().replace(/^the /, '').replace(/[^a-z0-9 ]/g, '').split(' ').slice(0, 2).join(' '))
    .forEach(t => seen.size < 6 && seen.add(t));
  [...seen].forEach(t => D.h('div', 'chip', chips, t));
} else {
  const hubs = await search(query);
  if (!hubs.length) {
    D.h('div', 'msg', box, 'Nothing for “' + query + '”');
    D.h('p', '', box, 'Try a different spelling, or part of the title.');
  }
  let y = 0;
  hubs.forEach(hub => {
    const wide = hub.type === 'episode';
    const w = wide ? 356 : 200, hgt = wide ? 200 : 300, step = w + 28;
    const row = D.h('section', 'rrow', box);
    row.style.top = y + 'px';
    D.h('div', 't-row', row, hub.title);
    hub.Metadata.slice(0, 7).forEach((it, i) => {
      const t = D.h('div', 'tile', row);
      t.style.left = i * step + 'px';
      const f = D.h('div', 'f', t);
      f.style.cssText = `width:${w}px;height:${hgt}px`;
      D.h('img', '', f).src = D.img(wide ? D.wideArt(it) : D.posterArt(it), w, hgt);
      const p = D.progress(it);
      if (p) { const b = D.h('div', 'bar', f); D.h('i', '', b).style.width = (p * 100).toFixed(1) + '%'; }
      if (it.type === 'show' && it.leafCount) {
        const n = it.leafCount - (it.viewedLeafCount || 0);
        if (n > 0) D.h('div', 'count', f, String(n));
      }
      const [a, b] = caption(it);
      const c = D.h('div', 'cap', t, a);
      c.style.width = w + 'px';
      D.h('small', '', c, b);
    });
    y += 56 + hgt + 16 + 57 + 44;
  });
}
</script>
</body>
</html>
