<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Kinescope · Icon</title>
<link rel="stylesheet" href="evening.css">
<style>
/* Tizen app icon, 512x512, full bleed. Exported as a PNG, so the static glow costs nothing at runtime.
   ?size=117 shows it at the Smart Hub size. */
html, body { width: 512px; height: 512px; }
.icon { position: absolute; left: 0; top: 0; width: 512px; height: 512px; overflow: hidden; transform-origin: 0 0;
  background: radial-gradient(circle at 50% 44%, rgba(201, 130, 91, 0.46) 0, rgba(201, 130, 91, 0.16) 34%, rgba(201, 130, 91, 0) 64%), #101115; }
.icon svg { position: absolute; left: 121px; top: 113px; width: 270px; height: 270px; color: var(--text); }
</style>
</head>
<body>
<div class="icon" id="icon"></div>
<script type="module">
import { MARK } from './chrome.js';
const icon = document.getElementById('icon');
icon.innerHTML = MARK;
const size = Number(new URLSearchParams(location.search).get('size')) || 512;
if (size !== 512) {
  document.documentElement.style.cssText = document.body.style.cssText = `width:${size}px;height:${size}px`;
  icon.style.transform = `scale(${size / 512})`;
}
</script>
</body>
</html>
