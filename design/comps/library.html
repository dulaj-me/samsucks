<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Kinescope · Library</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Mona+Sans:wdth,wght@100..112,400..800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="evening.css">
<style>
.bar-row { position: absolute; left: 96px; right: 96px; top: 148px; height: 56px; display: flex; align-items: center; gap: 14px; z-index: 4; }
.total { margin-left: auto; font: 520 23px/1 var(--sans); color: var(--mute); }
.grid { position: absolute; left: 0; top: 248px; width: 1920px; height: 832px; overflow: hidden; }
.grid .tile .f { width: 220px; height: 330px; }
.grid .cap { width: 220px; font-size: 21px; }
.grid .cap small { font-size: 18px; }
.alpha { position: absolute; right: 40px; top: 260px; display: flex; flex-direction: column; gap: 2px; font: 600 15px/22px var(--sans); color: var(--mute); text-align: center; width: 24px; }
.alpha b { color: var(--text); }
.empty { position: absolute; left: 96px; top: 300px; width: 900px; }
</style>
</head>
<body>
<script type="module">
import * as D from './data.js';
import { nav, backdrop, ambience, lift, icon } from './chrome.js';
const q = new URLSearchParams(location.search);
const state = q.get('state') || '';
const { sections } = await D.load();
const sec = sections.find(s => s.type === 'movie');
const { amb, art } = backdrop();
art.remove();
nav(sections, sec.title);

const get = async p => (await (await fetch('/pms' + p, { headers: { Accept: 'application/json' } })).json()).MediaContainer;
const genres = (await get('/library/sections/' + sec.key + '/genre')).Directory || [];
const pick = state === 'genre' || state === 'filtered' ? genres.find(g => g.title === 'Comedy') : state === 'empty' ? genres.find(g => g.title === 'War') : null;
const unwatched = state === 'empty';
const params = new URLSearchParams({ sort: 'addedAt:desc', 'X-Plex-Container-Start': 0, 'X-Plex-Container-Size': 28 });
if (pick && state !== 'genre') params.set('genre', pick.key);
if (unwatched) params.set('unwatched', 1);
const res = state === 'empty' ? { Metadata: [], totalSize: 0 } : await get('/library/sections/' + sec.key + '/all?' + params);
const items = res.Metadata || [];

// Filter bar
const bar = D.h('div', 'bar-row', document.body);
const focusChip = state === 'empty' ? 'clear' : state === 'genre' ? 'genre' : '';
const genreChip = D.h('div', 'chip' + (pick && state !== 'genre' ? ' set' : '') + (focusChip === 'genre' ? ' focus' : ''), bar);
genreChip.innerHTML = 'Genre <b>' + (pick && state !== 'genre' ? pick.title : 'All') + '</b>' + icon.down;
const uw = D.h('div', 'chip' + (unwatched ? ' set' : ''), bar);
uw.innerHTML = (unwatched ? icon.check : icon.circle) + 'Unwatched';
const sort = D.h('div', 'chip', bar);
sort.innerHTML = 'Sort <b>Recently added</b>' + icon.down;
if (state === 'empty') { const c = D.h('div', 'chip focus', bar); c.innerHTML = icon.minus.replace('M5 12h14', 'M6 6l12 12M18 6L6 18') + 'Clear filters'; }
const total = state === 'empty' ? 0 : (res.totalSize ?? items.length);
D.h('div', 'total', bar, total + (total === 1 ? ' movie' : ' movies'));

// Grid: 7 columns, the focused poster lifts in place.
const grid = D.h('div', 'grid', document.body);
const W = 220, H = 330, GX = 30, GY = 112, COLS = 7, FOCUS = state === 'genre' || state === 'empty' ? -1 : 2;
if (state === 'loading') {
  for (let i = 0; i < 14; i++) {
    const t = D.h('div', 'tile', grid);
    t.style.left = (96 + (i % COLS) * (W + GX)) + 'px'; t.style.top = (16 + Math.floor(i / COLS) * (H + GY)) + 'px';
    D.h('div', 'skel', t).style.cssText = `width:${W}px;height:${H}px`;
    D.h('div', 'skel-line', t).style.cssText = 'width:150px;margin-top:18px';
  }
} else {
  items.forEach((it, i) => {
    const x = 96 + (i % COLS) * (W + GX), y = 16 + Math.floor(i / COLS) * (H + GY);
    if (i === FOCUS) lift(grid, x, y, W, H);
    const t = D.h('div', 'tile' + (i === FOCUS ? ' focus' : ''), grid);
    t.style.left = x + 'px'; t.style.top = y + 'px';
    const f = D.h('div', 'f', t);
    D.h('img', '', f).src = D.img(it.thumb, W, H);
    const p = D.progress(it);
    if (p) { const b = D.h('div', 'bar', f); D.h('i', '', b).style.width = (p * 100).toFixed(1) + '%'; }
    else if (it.viewCount) D.h('div', 'seen', f).innerHTML = icon.check;
    const c = D.h('div', 'cap', t, it.title);
    if (i === FOCUS) c.style.transform = 'translateY(12px)';
    D.h('small', '', c, [it.year, D.runtime(it.duration)].filter(Boolean).join('  ·  '));
  });
}
const focused = items[FOCUS] || items[0];
ambience(amb, focused && focused.UltraBlurColors);

if (state === 'empty') {
  const e = D.h('div', 'empty', document.body);
  D.h('div', 'msg', e, 'No unwatched war movies');
  D.h('p', '', e, 'Clear the filters to see the whole library.');
}

if (state === 'genre') {
  D.h('div', 'scrim', document.body);
  const s = D.h('div', 'sheet', document.body);
  D.h('h2', '', s, 'Genre');
  D.h('div', 'sub', s, sec.title);
  const o = D.h('div', 'opts', s);
  const list = [{ title: 'All genres' }].concat(genres).slice(0, 11);
  list.forEach((g, i) => {
    const el = D.h('div', 'opt' + (g.title === 'Comedy' ? ' focus' : ''), o);
    D.h('span', '', el, g.title);
    if (i === 0) D.h('span', 'tick', el).innerHTML = icon.check;
  });
  const more = D.h('div', 'sub', s, genres.length + ' genres');
  more.style.marginTop = '18px';
}
</script>
</body>
</html>
